; hallmonitor kit firmware for the M5StickS3 (the default) and the M5StickC Plus2.

[platformio]
default_envs = sticks3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^7.2.0

; The StickS3's ESP32-S3-N8R8 has 8 MB of flash and 8 MB of octal PSRAM. Its USB port is the S3's
; built-in USB serial, which carries the serial console.
[env:sticks3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; PlatformIO has no Plus2 board definition, so this starts from the M5StickC and overrides what
; differs: the Plus2's ESP32-PICO-V3-02 has 8 MB of flash and 2 MB of PSRAM. The 8 MB partition
; table leaves two app slots for over-the-air updates later.
[env:stickc-plus2]
platform = espressif32@^6.9.0
board = m5stick-c
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DPLUS2_BUZZER
