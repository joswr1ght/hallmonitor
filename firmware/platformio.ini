; hallmonitor kit firmware for the M5StickC Plus2.
;
; PlatformIO has no Plus2 board definition, so this starts from the M5StickC and overrides what
; differs: the Plus2's ESP32-PICO-V3-02 has 8 MB of flash and 2 MB of PSRAM. The 8 MB partition
; table leaves two app slots for over-the-air updates later.

[env:stickc-plus2]
platform = espressif32@^6.9.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^7.2.0
